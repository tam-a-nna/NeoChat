
<!DOCTYPE html>
<html>
<head>
    <title>Chat Room</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; background: #667eea; }
        .container { max-width: 600px; margin: auto; background: white; border-radius: 10px; overflow: hidden; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        .messages { height: 400px; overflow-y: auto; padding: 15px; background: #ecf0f1; }
        .message { margin: 5px 0; padding: 8px; border-radius: 5px; }
        .system { background: #95a5a6; color: white; text-align: center; }
        .input-area { padding: 15px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; cursor: pointer; }
        .join-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
                       display: flex; justify-content: center; align-items: center; }
        .join-box { background: white; padding: 30px; border-radius: 10px; text-align: center; }
        .join-box input { margin: 10px 0; width: 100%; }
        .join-box button { width: 100%; }
    </style>
</head>
<body>
    <div id="joinScreen" class="join-screen">
        <div class="join-box">
            <h2>Chat Room</h2>
            <input type="text" id="nickname" placeholder="Enter name">
            <button onclick="join()">Join</button>
        </div>
    </div>
    <div id="chat" class="container" style="display:none">
        <div class="header"><h3>Chat Room</h3></div>
        <div id="messages" class="messages"></div>
        <div class="input-area">
            <input type="text" id="message" placeholder="Type message..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">Send</button>
        </div>
    </div>
    <script>
        let ws, nickname;
        function join() {
            nickname = document.getElementById('nickname').value.trim();
            if(!nickname) return alert('Enter name');
            ws = new WebSocket('ws://localhost:8082');
            ws.onopen = () => {
                document.getElementById('joinScreen').style.display = 'none';
                document.getElementById('chat').style.display = 'block';
                ws.send(nickname);
            };
            ws.onmessage = (e) => {
                let div = document.createElement('div');
                div.className = 'message system';
                div.textContent = e.data;
                document.getElementById('messages').appendChild(div);
                div.scrollIntoView();
            };
            ws.onerror = () => alert('Server not running');
        }
        function send() {
            let msg = document.getElementById('message').value.trim();
            if(msg) { ws.send(msg); document.getElementById('message').value = ''; }
        }
    </script>
</body>
</html>
